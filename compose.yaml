services:
  api:
    build: ./server
    restart: unless-stopped
    env_file: .env
    ports:
      - "${MACLINK_BIND_ADDRESS:-127.0.0.1}:8099:8099"
    volumes:
      - maclink-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  maclink-data:
